[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxscoreCIpy"
version = "0.6.0"
description = "Cattaneo et al. (2020) Reshaped Bootstrap & Plug-in Hessian with fixed beta_1=1, unified bandwidth, and multi-start optimization"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0"
]